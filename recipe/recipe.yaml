context:
  version: "1.11.5"

package:
  name: scdoc
  version: ${{ version }}

source:
  url: https://git.sr.ht/~sircmpwn/scdoc/archive/${{ version }}.tar.gz
  sha256: 98780bbdf16c1bce89ef3a8c0f537ac6e4ea77087b609e7698857614488a2a62

build:
  number: 0
  skip: win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - make
    - pkg-config
    - sed
  host:
    - ncurses

tests:
  - script: |
      scdoc --help 2>&1 | grep -q "Usage: scdoc < input.scd > output.roff"

about:
  summary: Small man page generator
  license: MIT
  license_file: COPYING
  homepage: https://sr.ht/~sircmpwn/scdoc/

extra:
  recipe-maintainers:
    - danielnachun
    - pavelzw
